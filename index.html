<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Favicon. Ranije su ovdje stajala dva taga: jedan na https://imgur.com/02Xxtpy
      (stranica galerije, ne slika — browser je dobijao HTML umjesto ikonice) i
      Vite-ov podrazumijevani logo. Zato je u Google rezultatima stajala pogrešna
      ikonica. Sada je brend oznaka, u svim veličinama koje traže browseri i
      Google (minimum 48x48).
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10375C" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Naslov ispod je samo fallback. Opis, canonical, Open Graph i Twitter tagove
      postavlja src/components/Seo.tsx po stranici — namjerno ih NEMA ovdje, jer
      react-helmet ne briše statičke tagove pa bi svaka stranica imala dva opisa.
      Za dijeljenje linkova (Viber, Facebook, WhatsApp) te tagove u statički HTML
      upisuje `npm run build:prerender`.
    -->
    <title>Njemački jezik Banja Luka | Der Die Das centar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
